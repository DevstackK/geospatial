[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-geo-cleaning"
version = "0.1.0"
description = "Agent-to-agent framework for deterministic geospatial data cleaning"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "shapely>=2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
a2a-geo-clean = "a2a_geo_cleaning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

