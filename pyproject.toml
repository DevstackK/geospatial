[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-geo-cleaning"
version = "0.1.0"
description = "Agent-to-agent framework for deterministic geospatial data cleaning"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
a2a = [
  "a2a-sdk[http-server]>=1.1.2",
  "uvicorn>=0.30",
]
worker = [
  "starlette>=0.37",
  "uvicorn>=0.30",
]
geo = [
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "shapely>=2.0",
]
postgis = [
  "psycopg[binary]>=3.1",
]
oracle = [
  "oracledb>=2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
a2a-geo-clean = "a2a_geo_cleaning.cli:main"
a2a-geo-agent = "a2a_geo_cleaning.a2a_server:main"
geoflow-worker = "a2a_geo_cleaning.worker.api:main"

[tool.setuptools.packages.find]
where = ["src"]
